name: external-sms-validation
on:
  push:
    branches: [main]
    paths:
      - "analyzers/**"
      - "engine/**"
      - "tools/evaluate_uci_sms.py"
      - ".github/workflows/external-validation.yml"
  workflow_dispatch:
jobs:
  uci-sms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download UCI SMS Spam Collection
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip"
          urllib.request.urlretrieve(url, "/tmp/uci-sms.zip")
          PY
          python -m zipfile -e /tmp/uci-sms.zip /tmp/uci-sms
      - name: Evaluate without training or tuning
        run: |
          python tools/evaluate_uci_sms.py /tmp/uci-sms/SMSSpamCollection --json external_sms_results.json
          cat external_sms_results.json
          echo '## SENTRA external SMS evaluation results' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat external_sms_results.json >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload external evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: sentra-uci-sms-results
          path: external_sms_results.json
          if-no-files-found: error
