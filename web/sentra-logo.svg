<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">SENTRA — Dragon Shield</title>
<desc id="desc">A detailed silver cyber dragon head in profile inside an angular shield, with violet and cyan energy accents and the SENTRA wordmark.</desc>
<defs>
 <linearGradient id="rim" x1="80" y1="25" x2="300" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#C8B8FF"/><stop offset=".48" stop-color="#805BFF"/><stop offset="1" stop-color="#00E8FF"/></linearGradient>
 <linearGradient id="steel" x1="80" y1="40" x2="270" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".28" stop-color="#DCE5F4"/><stop offset=".66" stop-color="#899BB9"/><stop offset="1" stop-color="#D5F9FF"/></linearGradient>
 <linearGradient id="darksteel" x1="90" y1="80" x2="270" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#AEBED6"/><stop offset="1" stop-color="#344361"/></linearGradient>
 <linearGradient id="word" x1="390" y1="75" x2="820" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D9E6FF"/><stop offset="1" stop-color="#71EFFF"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<ellipse cx="177" cy="154" rx="142" ry="132" fill="#754BFF" opacity=".12" filter="url(#soft)"/>
<path d="M174 13 307 62v93c0 75-47 119-133 143C88 274 41 230 41 155V62L174 13Z" fill="#080E1C" stroke="url(#rim)" stroke-width="8" stroke-linejoin="round"/>
<path d="M174 29 291 72v82c0 65-39 104-117 130-78-26-117-65-117-130V72l117-43Z" fill="#0C1426" stroke="#34436A" stroke-width="2"/>
<path d="M64 111h39l22 18M284 111h-39l-22 18M76 202h35l17-16M272 202h-35l-17-16" fill="none" stroke="#21DDF4" stroke-width="3" opacity=".62" stroke-linecap="round"/>
<g filter="url(#glow)">
 <!-- swept-back horns and crown -->
 <path d="M111 120 76 54l75 39 28-42 7 62 49-39-11 57Z" fill="url(#darksteel)" stroke="#EAF3FF" stroke-width="3" stroke-linejoin="round"/>
 <path d="m116 101-8-47 40 42M177 103l28-55 4 62M224 117l43-27-24 52" fill="#8A6BFF" stroke="#D9D0FF" stroke-width="3" stroke-linejoin="round"/>
 <!-- dragon face profile -->
 <path d="M82 132 119 111l54 4 39 17 35 3 25 24-35 7-18 27-42 8-23 31-17-23-39-2 17-23-38-11 27-18-22-23Z" fill="url(#steel)" stroke="#F8FCFF" stroke-width="3" stroke-linejoin="round"/>
 <!-- brow and muzzle plates -->
 <path d="m145 123 44-7 39 19-37 11-43-7Z" fill="#172238" stroke="#A8B7D0" stroke-width="2"/>
 <path d="m190 129 25 3-19 12Z" fill="#FF386C"/><circle cx="205" cy="133" r="3.2" fill="#FFFFFF"/>
 <path d="m228 154 42 8-39 10-29-5Z" fill="url(#darksteel)" stroke="#EAF7FF" stroke-width="2"/>
 <path d="m236 166 21 1-17 7Z" fill="#10192A"/>
 <!-- jaw, teeth, scales -->
 <path d="m155 177 39 13 33-12-16 29-40 11-26-17Z" fill="#536785" stroke="#D6E7F8" stroke-width="2"/>
 <path d="m191 188-7 15-7-16m28 3-7 15-6-13" fill="#FFFFFF"/>
 <path d="m103 150 25 8-14 17m20-6 25 10-15 18m-30-11 19 7-10 13" fill="none" stroke="#657B9D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="m129 120 17 12-18 3m43-18 17 12-19 5m26 11 17 10-19 5" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".75"/>
 <!-- neck spines -->
 <path d="m104 191-18 27 34-7m5 1-8 26 30-17m5 1 3 24 22-24" fill="#7C63FF" stroke="#D6D0FF" stroke-width="2" stroke-linejoin="round"/>
</g>
<path d="M174 252v19m-10-10 10 10 10-10" fill="none" stroke="#25E8F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g>
 <text x="365" y="156" fill="url(#word)" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="13">SENTRA</text>
 <path d="M372 184h440" stroke="url(#rim)" stroke-width="2" opacity=".8"/>
 <text x="375" y="222" fill="#AAB8D2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="5">DETECT  •  PROTECT  •  STAY SAFE</text>
 <text x="375" y="253" fill="#657795" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">AI-POWERED CYBERSECURITY ASSISTANT</text>
</g>
</svg>