<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">SENTRA — Dragon Shield</title>
<desc id="desc">A fierce original cyber dragon curled around a luminous shield, with circuit details.</desc>
